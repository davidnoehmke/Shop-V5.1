name: Shopify Staging Delivery

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
    secrets:
      SHOPIFY_STORE:
        required: true
      SHOPIFY_CLI_THEME_TOKEN:
        required: true
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
    outputs:
      preview_url:
        value: ${{ jobs.deploy.outputs.preview_url }}
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact commit to stage; leave empty to use this main revision'
        required: false
        type: string

permissions:
  contents: read

# Manual staging shares the outer release lock. A reusable invocation already
# owns that lock in LEAF Code Request and must not deadlock against itself.
concurrency:
  group: ${{ github.workflow == 'LEAF Code Request' && format('leaf-preview-{0}', github.run_id) || 'leaf-code-delivery' }}
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy unpublished staging
    if: github.repository == 'davidnoehmke/Shop-V5.1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: shopify-preview
    outputs:
      preview_url: ${{ steps.delivery.outputs.preview_url }}
    steps:
      - name: Checkout trusted delivery controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Validate exact revision and configuration
        env:
          REVISION: ${{ inputs.commit_sha || github.sha }}
          STORE: ${{ secrets.SHOPIFY_STORE }}
          HAS_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN != '' }}
          STAGING: ${{ vars.SHOPIFY_STAGING_THEME_ID }}
          LIVE: ${{ vars.SHOPIFY_LIVE_THEME_ID }}
        run: |
          node <<'JS'
          const e = process.env;
          const problems = [];
          if (!/^[0-9a-f]{40}$/.test(e.REVISION || '')) problems.push('commit_sha must be an exact 40-character SHA');
          if (!/^[a-z0-9][a-z0-9-]*\.myshopify\.com$/.test(e.STORE || '')) problems.push('SHOPIFY_STORE is missing or is not a canonical myshopify.com host');
          if (e.HAS_TOKEN !== 'true') problems.push('SHOPIFY_CLI_THEME_TOKEN is missing');
          if (!/^[1-9][0-9]*$/.test(e.STAGING || '')) problems.push('SHOPIFY_STAGING_THEME_ID is missing');
          if (!/^[1-9][0-9]*$/.test(e.LIVE || '')) problems.push('SHOPIFY_LIVE_THEME_ID is missing');
          if (e.STAGING && e.STAGING === e.LIVE) problems.push('Staging must not be the live theme');
          if (problems.length) { console.error(problems.join('\n')); process.exit(1); }
          JS
      - name: Checkout candidate as data, not as the controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          path: candidate
          persist-credentials: false
      - id: metadata
        run: |
          echo "commit=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Install pinned Shopify CLI
        run: npm install -g @shopify/cli@4.7.0
      - id: delivery
        name: Check theme roles and quality before uploading
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_STAGING_THEME_ID: ${{ vars.SHOPIFY_STAGING_THEME_ID }}
          SHOPIFY_LIVE_THEME_ID: ${{ vars.SHOPIFY_LIVE_THEME_ID }}
          CANDIDATE_PATH: candidate
        run: node control/automation/codex/delivery.cjs staging
      - name: Record accurate deployment result
        if: always()
        env:
          REVISION: ${{ steps.metadata.outputs.commit }}
          STARTED_MS: ${{ steps.metadata.outputs.started_ms }}
          THEME_ID: ${{ vars.SHOPIFY_STAGING_THEME_ID }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          async function main() {
            const e = process.env;
            const status = e.DELIVERY_OUTCOME === 'success' ? 'succeeded' : e.DELIVERY_OUTCOME === 'skipped' ? 'not_started' : 'failed';
            fs.appendFileSync(e.GITHUB_STEP_SUMMARY, `## Shopify staging\nCommit: ${e.REVISION || 'not checked out'}\nTheme: ${e.THEME_ID || 'not configured'}\nResult: ${status}\nLive publication: not performed by this workflow\n`);
            if (!e.SUPABASE_URL || !e.SUPABASE_SERVICE_ROLE_KEY) {
              fs.appendFileSync(e.GITHUB_STEP_SUMMARY, 'Supabase telemetry: not configured; GitHub remains the execution log.\n'); return;
            }
            if (!e.REVISION || !e.THEME_ID || !e.STARTED_MS) {
              fs.appendFileSync(e.GITHUB_STEP_SUMMARY, 'Supabase telemetry: skipped because deployment metadata is incomplete.\n'); return;
            }
            const url = new URL('/rest/v1/deployments', e.SUPABASE_URL);
            if (url.protocol !== 'https:') throw new Error('HTTPS required for telemetry');
            const payload = {environment: 'staging', commit_sha: e.REVISION, theme_id: e.THEME_ID, workflow_run_id: e.GITHUB_RUN_ID,
              status: status === 'succeeded' ? 'succeeded' : 'failed', duration_ms: Math.max(0, Date.now() - Number(e.STARTED_MS)),
              files_changed: 0, analysis: {files_changed_known: false, validation_and_upload: e.DELIVERY_OUTCOME || 'not_run', browser_tests: 'not_run_by_this_workflow'}, finished_at: new Date().toISOString()};
            const response = await fetch(url, {method: 'POST', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: {apikey: e.SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${e.SUPABASE_SERVICE_ROLE_KEY}`, 'Content-Type': 'application/json', 'Content-Profile': 'ops', Prefer: 'return=minimal'}, body: JSON.stringify(payload)});
            if (!response.ok) throw new Error(`Telemetry HTTP ${response.status}`);
            fs.appendFileSync(e.GITHUB_STEP_SUMMARY, 'Supabase telemetry: recorded.\n');
          }
          main().catch(() => {
            console.warn('Optional Supabase telemetry failed; deployment result has not been changed.');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Supabase telemetry: FAILED; see GitHub for the authoritative execution outcome.\n');
          });
          JS
