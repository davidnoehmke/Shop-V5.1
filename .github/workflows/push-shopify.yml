name: Shopify Staging Delivery

on:
  workflow_run:
    workflows: ['LEAF CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-staging-delivery
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, analyze and deploy staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: shopify-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Resolve deployment metadata
        id: meta
        shell: bash
        env:
          STAGING_THEME_ID: ${{ vars.SHOPIFY_STAGING_THEME_ID }}
        run: |
          set -euo pipefail
          test -n "$STAGING_THEME_ID"
          [[ "$STAGING_THEME_ID" =~ ^[0-9]+$ ]]
          echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          echo "theme_id=$STAGING_THEME_ID" >> "$GITHUB_OUTPUT"
          echo "files_changed=$(git diff --name-only HEAD^ HEAD 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Theme quality gate
        run: |
          gem install theme-check
          theme-check theme

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Deploy repository theme to permanent staging theme
        id: push
        working-directory: theme
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          THEME_ID: ${{ steps.meta.outputs.theme_id }}
        run: |
          set -euo pipefail
          test -n "$SHOPIFY_STORE"
          test -n "$SHOPIFY_CLI_THEME_TOKEN"
          shopify theme push --theme "$THEME_ID" --path . --store "$SHOPIFY_STORE" --password "$SHOPIFY_CLI_THEME_TOKEN" --nodelete

      - name: Record deployment and analysis in Supabase
        if: always()
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          THEME_ID: ${{ steps.meta.outputs.theme_id }}
          STARTED_MS: ${{ steps.meta.outputs.started_ms }}
          FILES_CHANGED: ${{ steps.meta.outputs.files_changed }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          now_ms=$(date +%s%3N)
          duration=$((now_ms - STARTED_MS))
          if [ "$PUSH_OUTCOME" = "success" ]; then status=succeeded; else status=failed; fi
          payload=$(jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg theme "$THEME_ID" \
            --arg run "$GITHUB_RUN_ID" \
            --arg status "$status" \
            --argjson duration "$duration" \
            --argjson files "${FILES_CHANGED:-0}" \
            '{environment:"staging",commit_sha:$commit,theme_id:$theme,workflow_run_id:$run,status:$status,duration_ms:$duration,files_changed:$files,analysis:{ci:"passed",theme_check:"passed",deployment_mode:"permanent_staging"},finished_at:(now|todate)}')
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/deployments" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Content-Profile: ops' \
            -H 'Prefer: return=minimal' \
            --data "$payload"

      - name: Deployment documentation
        if: always()
        shell: bash
        env:
          THEME_ID: ${{ steps.meta.outputs.theme_id }}
          FILES_CHANGED: ${{ steps.meta.outputs.files_changed }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          {
            echo '### LEAF Shopify staging delivery'
            echo "- Commit: $GITHUB_SHA"
            echo "- Permanent staging theme: $THEME_ID"
            echo "- Files changed in commit: ${FILES_CHANGED:-unknown}"
            echo "- Push result: ${PUSH_OUTCOME:-not-run}"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo '- CI and Theme Check are mandatory gates.'
            echo '- Deployment telemetry is written to Supabase ops.deployments.'
            echo '- Production publication remains a separate controlled gate.'
          } >> "$GITHUB_STEP_SUMMARY"
