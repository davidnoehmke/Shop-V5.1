name: LEAF Pipeline Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/leaf-*.yml'
      - 'automation/codex/**'

permissions:
  contents: read

jobs:
  readiness:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report configuration without exposing credentials
        env:
          ENABLED: ${{ vars.LEAF_AUTOMATION_ENABLED }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_APP_ID: ${{ vars.LEAF_GITHUB_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.LEAF_GITHUB_APP_PRIVATE_KEY != '' }}
          HAS_BOT_TOKEN: ${{ secrets.LEAF_GITHUB_TOKEN != '' }}
          HAS_SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN != '' }}
          HAS_SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE != '' }}
          LIVE_SYNC_CONFIRMED: ${{ vars.LEAF_NATIVE_SYNC_CONFIRMED }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const yes = key => process.env[key] === 'true';
          const checks = {
            'OpenAI API key': yes('HAS_OPENAI_KEY'),
            'GitHub App or scoped bot token': (yes('HAS_APP_ID') && yes('HAS_APP_KEY')) || yes('HAS_BOT_TOKEN'),
            'Shopify Theme Access token': yes('HAS_SHOPIFY_TOKEN'),
            'Shopify store domain': yes('HAS_SHOPIFY_STORE'),
            'Native Shopify sync verified': yes('LIVE_SYNC_CONFIRMED')
          };
          const missing = Object.entries(checks).filter(([,ok]) => !ok).map(([name]) => name);
          const active = yes('ENABLED');
          const lines = ['## LEAF pipeline readiness', '', ...Object.entries(checks).map(([name, ok]) => `- ${name}: ${ok ? 'configured' : 'MISSING'}`), '', `Automation enabled: ${active}`, `Operational readiness: ${missing.length ? 'BLOCKED' : 'configuration present; end-to-end test still required'}`, '', 'This diagnostic does not generate code, merge, or deploy. No secret values are printed.'];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          if (missing.length) console.log('Missing configuration: ' + missing.join(', '));
          if (active && missing.length) process.exitCode = 1;
          JS
