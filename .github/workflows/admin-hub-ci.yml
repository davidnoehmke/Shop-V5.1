name: Admin Hub CI

on:
  pull_request:
    paths:
      - 'control_center/**'
      - 'supabase/migrations/**'
      - '.github/workflows/admin-hub-ci.yml'
  push:
    branches: [main]
    paths:
      - 'control_center/**'
      - 'supabase/migrations/**'
      - '.github/workflows/admin-hub-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-admin-hub:
    name: Validate Admin Hub
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile control_center/admin_hub.py
      - name: Validate runtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'admin_panel_snapshot' control_center/admin_hub.py
          grep -q 'ADMIN_CHANGELOG_READ_TOKEN' control_center/admin_hub.py
          grep -q 'LEAF_LICENSE_SHA256' control_center/admin_hub.py
          if grep -R -nE 'SUPABASE_SERVICE_ROLE_KEY|service_role' control_center/admin_hub.py; then
            echo 'Admin Hub must not use a Supabase service-role key.' >&2
            exit 1
          fi
      - name: Validate security migration
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/migrations/20260916134000_secure_admin_bootstrap_config_rls.sql'
          test -f "$file"
          grep -qi 'enable row level security' "$file"
          grep -qi 'revoke all .* anon, authenticated' "$file"
