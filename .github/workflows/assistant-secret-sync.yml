name: Assistant model credential sync

on:
  workflow_run:
    workflows: ['LEAF CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-model-credential-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'davidnoehmke/Shop-V5.1' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Transfer existing model credential to the private server vault
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          required = ('OPENAI_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              sys.exit('Required GitHub secret missing: ' + ', '.join(missing))

          # Pin the destination: repository configuration cannot redirect credentials.
          base = 'https://vbqimcwaxcydegqlkkgw.supabase.co/rest/v1/rpc/'
          service_key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()
          headers = {'apikey': service_key, 'Authorization': 'Bearer ' + service_key,
                     'Content-Type': 'application/json'}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def rpc(name, payload):
              request = urllib.request.Request(base + name, method='POST', headers=headers,
                  data=json.dumps(payload).encode())
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  sys.exit('Credential sync failed with HTTP ' + str(error.code))
              except (urllib.error.URLError, TimeoutError):
                  sys.exit('Credential sync could not reach the configured project')

          rpc('leaf_set_server_secret', {
              'p_name': 'OPENAI_API_KEY',
              'p_value': os.environ['OPENAI_API_KEY'].strip(),
              'p_description': 'LEAFerservice public assistant; provisioned from GitHub Actions'
          })
          if rpc('leaf_secret_exists', {'p_name': 'OPENAI_API_KEY'}) is not True:
              sys.exit('Credential sync verification failed')
          print('Assistant credential synchronized and presence verified; no values logged.')
          PY
