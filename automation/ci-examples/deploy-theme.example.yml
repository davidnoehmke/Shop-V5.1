# Inaktives Beispiel: Diese Datei bleibt außerhalb von .github/workflows, bis
# Theme, Shop und Deployment-Regeln geprüft wurden.
name: Deploy Shopify Theme (example)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Theme Check
        run: shopify theme check --path theme

      - name: Push reviewed theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_THEME_ID }}
        run: shopify theme push --store="$SHOPIFY_STORE" --theme="$SHOPIFY_THEME_ID" --path theme
